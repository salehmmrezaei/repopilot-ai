services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    environment: &backend_environment
      APP_DATABASE_URL: ${APP_DATABASE_URL:?Set APP_DATABASE_URL in .env}
      APP_REDIS_URL: ${APP_REDIS_URL:-redis://redis:6379/0}
      APP_IMPORT_DOWNLOAD_BYTES: ${APP_IMPORT_DOWNLOAD_BYTES:-10485760}
      APP_REPAIRS_ENABLED: ${APP_REPAIRS_ENABLED:-false}
      APP_EXECUTIONS_ENABLED: ${APP_EXECUTIONS_ENABLED:-false}
      APP_SANDBOX_URL: ${APP_SANDBOX_URL:-https://sandbox.invalid}
      APP_SANDBOX_TOKEN: ${APP_SANDBOX_TOKEN:-}
      APP_AGENTS_ENABLED: ${APP_AGENTS_ENABLED:-false}
      APP_AGENT_DAILY_REQUEST_LIMIT: ${APP_AGENT_DAILY_REQUEST_LIMIT:-20}
      APP_ANSWERS_ENABLED: ${APP_ANSWERS_ENABLED:-false}
      APP_ANSWER_MODEL: ${APP_ANSWER_MODEL:-gpt-4.1-mini-2025-04-14}
      APP_ANSWER_MAX_OUTPUT_TOKENS: ${APP_ANSWER_MAX_OUTPUT_TOKENS:-1200}
      APP_ANSWER_DAILY_REQUEST_LIMIT: ${APP_ANSWER_DAILY_REQUEST_LIMIT:-100}
      APP_ANSWER_INPUT_PRICE_PER_MILLION: ${APP_ANSWER_INPUT_PRICE_PER_MILLION:-0.40}
      APP_ANSWER_OUTPUT_PRICE_PER_MILLION: ${APP_ANSWER_OUTPUT_PRICE_PER_MILLION:-1.60}
      APP_EMBEDDINGS_ENABLED: ${APP_EMBEDDINGS_ENABLED:-false}
      APP_OPENAI_API_KEY: ${APP_OPENAI_API_KEY:-}
      APP_EMBEDDING_TOKEN_BUDGET: ${APP_EMBEDDING_TOKEN_BUDGET:-200000}
      APP_EMBEDDING_PRICE_PER_MILLION: ${APP_EMBEDDING_PRICE_PER_MILLION:-0.02}
      APP_INDEX_TIMEOUT_SECONDS: ${APP_INDEX_TIMEOUT_SECONDS:-90}
      APP_IMPORT_TIMEOUT_SECONDS: ${APP_IMPORT_TIMEOUT_SECONDS:-90}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_FRONTEND_ORIGIN: ${APP_FRONTEND_ORIGIN:-http://localhost:3000}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_SESSION_LIFETIME_HOURS: ${APP_SESSION_LIFETIME_HOURS:-24}
      APP_DATABASE_TIMEOUT_SECONDS: ${APP_DATABASE_TIMEOUT_SECONDS:-3}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build: ./backend
    environment: *backend_environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
  worker:
    build: ./backend
    environment: *backend_environment
    command: ["celery", "-A", "app.jobs.celery_app:celery_app", "worker", "--loglevel=WARNING", "--concurrency=1"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  dispatcher:
    build: ./backend
    environment: *backend_environment
    command: ["python", "-m", "app.jobs.dispatcher"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
