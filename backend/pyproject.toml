[project]
name = "repopilot-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cryptography>=46,<49",
  "celery[redis]>=5.6,<6",
  "redis>=5,<7",
  "httpx>=0.28,<1",
  "argon2-cffi>=25.1,<26",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "pgvector>=0.4,<1",
  "tiktoken>=0.12,<1",
  "tree-sitter==0.25.2",
  "tree-sitter-typescript==0.23.2",
]
[dependency-groups]
dev = ["aiosqlite>=0.21,<1", "pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]
[tool.uv]
package = false
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a migrated PostgreSQL database"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
